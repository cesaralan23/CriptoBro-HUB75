[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
upload_port = COM8
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
  https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#67cf7e7
  adafruit/Adafruit GFX Library@1.12.6
  bblanchon/ArduinoJson@6.21.5
  tzapu/WiFiManager@2.0.17
