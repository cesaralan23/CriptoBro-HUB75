name: Publicar firmware del cartel
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar herramientas
        run: python -m pip install platformio==6.1.18
      - name: Compilar
        run: pio run -e esp32dev
      - name: Probar generacion de manifest
        run: python -m unittest discover -s tests -v
      - name: Preparar manifest y validar version
        id: version
        run: |
          python tools/release_manifest.py --binary .pio/build/esp32dev/firmware.bin --output manifest.json
          echo "tag=$(python tools/release_manifest.py --tag-only)" >> "$GITHUB_OUTPUT"
      - name: Comprobar que la version sea nueva
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          current=json.load(open('manifest.json'))
          repo=os.environ['GITHUB_REPOSITORY']
          request=urllib.request.Request(f'https://api.github.com/repos/{repo}/releases/latest',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          try:
              release=json.load(urllib.request.urlopen(request))
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
          else:
              asset=next(a for a in release['assets'] if a['name']=='manifest.json')
              old=json.load(urllib.request.urlopen(asset['browser_download_url']))
              assert current['version_code'] > old['version_code'], 'Incrementar include/version.h antes de publicar'
          PY
      - name: Publicar release completa
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" .pio/build/esp32dev/firmware.bin manifest.json --draft --target "$GITHUB_SHA" --title "CriptoBro $TAG" --notes "Firmware HUB75 64x32. El cartel actualiza automaticamente al detectar esta version."
          gh release edit "$TAG" --draft=false --latest
